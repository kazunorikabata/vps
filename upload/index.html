<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>資料の送信｜蒲田和紀税理士事務所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/upload/upload.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">蒲田和紀税理士事務所</a>
    </div>
  </header>

  <main class="section">
    <div class="container upload">
      <h1 class="section-title">資料の送信</h1>

      <p id="invalid" class="upload-message" hidden>このURLは無効です。事務所にお問い合わせください。</p>

      <form id="upload-form">
        <p>送信したい資料を選んで「送信する」を押してください。</p>
        <ul class="upload-rules">
          <li>1ファイル50MBまで</li>
          <li>PDF、画像（JPG・PNG・HEIC）、Excel、Word、CSV</li>
          <li>送信した資料は、このページには表示されません</li>
        </ul>
        <label class="file-picker">
          <input type="file" id="files" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.xlsx,.xls,.docx,.doc,.csv">
          <span>ファイルを選ぶ</span>
        </label>
        <ul id="file-list" class="file-list"></ul>
        <button type="submit" id="send" class="send-button" disabled>送信する</button>
      </form>

      <div id="done" class="upload-message" hidden>
        <p>送信が完了しました。ありがとうございました。</p>
        <button type="button" id="again" class="again-button">続けて送信する</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>蒲田和紀税理士事務所</p>
      <p>〒273-0021 千葉県船橋市海神3-2-15</p>
      <p><small>&copy; 蒲田和紀税理士事務所</small></p>
    </div>
  </footer>

  <script src="/upload/upload.js"></script>
</body>
</html>
