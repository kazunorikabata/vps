# kabaoffice.com の server ブロック（listen 443）の中に追加する

# 顧問先用：資料の送信
location /api/upload/ {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
}

# 顧問先用：入力ページの読み込みと送信（暗号化した入力内容を受け取るため、少し大きめにする）
location /api/form/ {
    limit_except POST { deny all; }
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8081/form/;
    proxy_set_header Host $host;
}

# 事務所内ページ：職員ごとのIDとパスワードで制限する
location /staff/ {
    auth_basic "kabaoffice staff";
    auth_basic_user_file /etc/nginx/kabaoffice-staff.htpasswd;
    try_files $uri $uri/ =404;
}

location /api/staff/ {
    auth_basic "kabaoffice staff";
    auth_basic_user_file /etc/nginx/kabaoffice-staff.htpasswd;
    limit_except POST { deny all; }
    # 事務所用の入力ページで、暗号化した入力内容を受け取るため、顧問先用と同じ大きさにする
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Staff-User $remote_user;
}
